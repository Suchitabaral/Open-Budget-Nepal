services:
  postgres:
    image: postgres:16-alpine
    container_name: open_budget_nepal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open_budget_nepal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-open_budget_nepal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: open_budget_nepal_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open_budget_nepal}?schema=public
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5173,http://localhost:5174,http://localhost:8080}
      SEED_CSV_DIR: /app/csv
      ADMINISTRATIVE_REGISTRY_PATH: /app/shared/data/administrative/nepal-local-levels.json
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
        VITE_RAG_API_BASE_URL: ${VITE_RAG_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: open_budget_nepal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  rag-service:
    profiles: ["rag"]
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: obn_rag_service
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PARSED_DOCUMENTS_DIR: /app/parsed_documents
      RAG_BM25_PARAMS: /app/.rag/bm25_params.json
      CORS_ORIGINS: ${RAG_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      - ./parsed_documents:/app/parsed_documents:ro
      - rag_hf_cache:/home/raguser/.cache/huggingface
      - rag_sentence_transformers_cache:/home/raguser/.cache/sentence-transformers
      - rag_runtime_data:/app/.rag
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  rag_hf_cache:
  rag_sentence_transformers_cache:
  rag_runtime_data:
