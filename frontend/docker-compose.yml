services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
    container_name: open-budget-nepal-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
