services:
  postgres:
    image: postgres:16-alpine
    container_name: open_budget_nepal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open_budget_nepal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-open_budget_nepal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: open_budget_nepal_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open_budget_nepal}?schema=public
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5173,http://localhost:5174,http://localhost:8080}
      SEED_CSV_DIR: /app/csv
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
    container_name: open_budget_nepal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  rag-service:
    profiles: ["rag"]
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: obn_rag_service
    environment:
      PYTHONUNBUFFERED: "1"
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-budgetrag}
      PINECONE_NAMESPACE: ${PINECONE_NAMESPACE:-codefest2025}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      RAG_TXT_DIR: ${RAG_TXT_DIR:-/app/rag_service/data}
      RAG_RETRIEVAL_K: ${RAG_RETRIEVAL_K:-3}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      - ./rag_service:/app/rag_service
      - rag_hf_cache:/home/raguser/.cache/huggingface
      - rag_sentence_transformers_cache:/home/raguser/.cache/sentence-transformers
    depends_on:
      ollama:
        condition: service_healthy
    init: true
    restart: unless-stopped

  ollama:
    profiles: ["rag"]
    image: ollama/ollama:latest
    container_name: obn_ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  rag_hf_cache:
  rag_sentence_transformers_cache:
  ollama_data:
